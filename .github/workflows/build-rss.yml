name: Build RSS Feed

on:
  push:
    branches: [main]
    paths-ignore:
      - 'rss.xml'

permissions:
  contents: write

jobs:
  build-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build RSS feed
        run: python3 build_rss.py

      - name: Commit updated rss.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          git diff --staged --quiet || git commit -m "Auto-update rss.xml [skip ci]"
          git push
